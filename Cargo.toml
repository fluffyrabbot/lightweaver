[package]
name = "lightweaver"
version = "0.1.0"
edition = "2021"
description = "Universal Data Pipeline Visualizer supporting 100+ tools via OpenLineage"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fluffyrabbot/lightweaver"
homepage = "https://github.com/fluffyrabbot/lightweaver"
documentation = "https://docs.rs/lightweaver"
keywords = ["data", "pipeline", "visualization", "openlineage", "dbt"]
categories = ["command-line-utilities", "visualization"]

[lib]
name = "lightweaver"
path = "src/lib.rs"

[[bin]]
name = "lightweaver"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# PNG export support
resvg = { version = "0.44", optional = true }
tiny-skia = { version = "0.11", optional = true }

# PDF export support
svg2pdf = { version = "0.12", optional = true }

[features]
default = ["png", "pdf"]
png = ["resvg", "tiny-skia"]
pdf = ["svg2pdf"]
